<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>love meter - sarah && kaan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lovemeter.css">
</head>
<body>
    <div class="container">
        <div class="code-editor">
            <div class="editor-header">
                <div class="dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="filename">lovemeter.js</div>
                <div></div>
            </div>
            
            <div class="code-content">
                <div class="line-numbers">
                    <span>1</span>
                    <span>2</span>
                    <span>3</span>
                    <span>4</span>
                    <span>5</span>
                    <span>6</span>
                    <span>7</span>
                    <span>8</span>
                    <span>9</span>
                </div>
                
                <div class="code">
                    <div class="code-line">
                        <span class="keyword">function</span> 
                        <span class="function">measureLove</span><span class="punctuation">()</span> 
                        <span class="punctuation">{</span>
                    </div>
                    
                    <div class="code-line indent">
                        <span class="comment">// who do you love more?</span>
                    </div>
                    
                    <div class="code-line indent">
                        <span class="keyword">const</span> 
                        <span class="variable">result</span> 
                        <span class="operator">=</span> 
                        <span class="string">"..."</span>
                        <span class="punctuation">;</span>
                    </div>
                    
                    <div class="code-line empty"></div>
                    
                    <div class="code-line indent">
                        <button class="measure-btn" id="measureBtn">
                            <span class="btn-icon">❤️</span>
                            <span class="btn-text">Measure</span>
                        </button>
                    </div>
                    
                    <div class="code-line empty"></div>
                    
                    <div class="code-line indent">
                        <span class="keyword">return</span> 
                        <span class="output-result" id="result">
                            <span class="hearts" id="hearts"></span>
                            <span class="result-text" id="resultText"></span>
                        </span>
                        <span class="punctuation">;</span>
                    </div>
                    
                    <div class="code-line">
                        <span class="punctuation">}</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="back-link">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>
    
    <script src="lovemeter.js"></script>
</body>
</html>
